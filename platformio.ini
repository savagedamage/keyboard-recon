; PlatformIO project — BLE identity scanner for an ESP32-S3 dev board.
; Build / upload / monitor:
;   pio run             # compile for esp32-s3-devkitc-1
;   pio run -t upload   # flash over USB (USB CDC on boot enabled)
;   pio device monitor  # serial @ 115200
;
; Host-native unit tests for the pure logic in include/ble_logic.hpp:
;   pio test -e native
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

[env:native]
platform = native
test_framework = unity
